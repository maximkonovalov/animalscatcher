name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check syntax
        run: python -m py_compile ac.py

      - name: Run ruff
        run: ruff check --select E,W,F ac.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux defaults to torch's CUDA build (multi-GB); this project
      # only runs on CPU, so install the CPU-only wheel first (same
      # guidance as the README's install instructions).
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project + dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # PytorchWildlife pulls in plain opencv-python transitively (via
      # supervision), which shares the `cv2` import path with
      # opencv-python-headless -- pip installs both, and whichever's
      # files land on disk last silently wins. Force headless to win:
      # the non-headless build needs libGL/GTK/X11 system libraries
      # this runner doesn't have, so if it wins, `import cv2` (and
      # every test) fails.
      - name: Force opencv-python-headless to win the cv2 conflict
        run: pip install --force-reinstall --no-deps opencv-python-headless==4.10.0.84

      - name: Run tests
        run: pytest tests/ -v
