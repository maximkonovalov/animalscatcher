name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check syntax
        run: python -m py_compile ac.py

      # Rule selection lives in ruff.toml (not here), so this matches
      # exactly what `ruff check ac.py` does anywhere, regardless of
      # which ruff version is installed.
      - name: Run ruff
        run: ruff check ac.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PytorchWildlife's yolov5 dependency imports pkg_resources in a
      # way that's incompatible with Python 3.12 (pkgutil.ImpImporter
      # was removed; upgrading setuptools to work around that instead
      # removes pkg_resources itself in newer releases). 3.10 is what's
      # actually been verified to work with this pin -- see README.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Linux defaults to torch's CUDA build (multi-GB); this project
      # only runs on CPU, so install the CPU-only wheel first (same
      # guidance as the README's install instructions).
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The full pinned set in requirements.txt (including numpy and
      # setuptools) is verified to resolve cleanly in one shot; see its
      # comments for why each pin is there.
      - name: Install project + dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # PytorchWildlife's own dependencies (ultralytics, and yolov5 via
      # sahi) unconditionally require plain opencv-python, which installs
      # alongside the opencv-python-headless pinned above and silently
      # wins the cv2 import (confirmed via cv2.__version__ -- `pip check`
      # alone doesn't catch this). Force headless back to being the one
      # actually used, so CI tests the same cv2 build production runs.
      - name: Fix opencv-python/opencv-python-headless conflict
        run: |
          OPENCV_HEADLESS_PIN=$(grep -o 'opencv-python-headless==[0-9.]*' requirements.txt)
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps "$OPENCV_HEADLESS_PIN"

      - name: Run tests
        run: pytest tests/ -v
