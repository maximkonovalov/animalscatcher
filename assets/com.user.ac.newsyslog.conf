# newsyslog config for this daemon's launchd-redirected stdout/stderr.
# Installed to /etc/newsyslog.d/ by deploy.sh, picked up automatically
# by macOS's own newsyslog service (runs roughly hourly).
#
# Rotation here only renames+archives the file; ac.py's own inherited
# stdout/stderr fds would otherwise keep appending to the now-renamed
# file forever (launchd only opens StandardOutPath/StandardErrorPath
# once, at process start). The pid_file + signal_number fields below
# have newsyslog send SIGUSR1 (30 on macOS) to ac.py right after
# rotating, which its _handle_log_reopen() handler uses to reopen
# fresh fds pointed at the same paths -- no daemon restart needed.
#
# logfilename                          [owner:group]  mode  count  size(KB)  when  flags  path_to_pid_file          signal_number
/Users/maxim/nvr/logs/ac_stdout.log     maxim:staff    644   5      10240     *     Z      /Users/maxim/nvr/ac.pid  30
/Users/maxim/nvr/logs/ac_error.log      maxim:staff    644   5      10240     *     Z      /Users/maxim/nvr/ac.pid  30
